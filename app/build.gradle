plugins {
    id 'com.android.application'
}

android {
    namespace 'it.paolo.pronosticicalcio'
    compileSdk 35

    defaultConfig {
        applicationId 'it.paolo.pronosticicalcio'
        minSdk 24
        targetSdk 35
        versionCode 16
        versionName '2.5'

        def apiFootballKey = System.getenv('API_FOOTBALL_KEY') ?: ''
        def escapedKey = apiFootballKey.replace('\\', '\\\\').replace('"', '\\"')
        buildConfigField 'String', 'API_FOOTBALL_KEY', '"' + escapedKey + '"'

        def footballDataKey = System.getenv('FOOTBALL_DATA_KEY') ?: ''
        def escapedFootballDataKey = footballDataKey.replace('\\', '\\\\').replace('"', '\\"')
        buildConfigField 'String', 'FOOTBALL_DATA_KEY', '"' + escapedFootballDataKey + '"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_PATH')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    testImplementation 'junit:junit:4.13.2'
}
